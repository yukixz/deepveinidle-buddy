<!doctype html><html><head><meta charset="utf-8"><style>[hidden]{display:none!important}#game{position:fixed;inset:0;z-index:2147483647;pointer-events:none}#game :is(button,input){pointer-events:auto}#game [data-market-window],#game .routes{background:#eee;max-width:450px;padding:8px}button,input{font-size:14px}[data-market-forsale]{display:none}[data-sheet-icon]{display:inline-block;width:16px;height:16px}</style></head><body><div id="game"><nav class="nav-strip" aria-label="Game navigation"><button class="nav-icon" type="button">Inventory</button></nav>
<button data-open="market">Market</button><div data-market-window hidden><button data-market-mode="buy">Browse</button><div data-market-chips><button data-family="all" aria-pressed="true">All</button></div><label>On sale<input type="checkbox" data-market-forsale checked></label><input data-market-search><div data-market-list><button data-item="1">Copper</button><button data-item="1001">Uncommon copper</button></div><div data-market-sheet hidden><button data-sheet-back>Back</button><i data-sheet-icon data-item="1"></i><div data-sheet-rarity><button data-rarity="0">Normal</button><button data-rarity="1">Uncommon</button></div><button data-list-side="buy">Buy order</button></div><div data-market-trade hidden><button data-trade-close>Close draft</button><input type="number" data-trade-price-in value="49"><input type="number" data-trade-qty-in value="1"><button data-trade-go>Submit purchase</button></div></div>
<div class="routes" hidden><div class="route-options" data-sheet="shut"><button data-opt-line aria-expanded="false">Change</button><div data-opt-sheet hidden><button data-stop-mode="count">Count</button><button data-stop-mode="time">Time</button><button data-stop-mode="endless">Endless</button><div data-stop-pane="count" hidden><input type="number" data-amount-any></div><div data-stop-pane="time" hidden>Time fields</div><div data-stop-pane="endless">Endless</div></div></div><div data-rarity-choices><button data-rarity="0">Normal</button><button data-rarity="1">Uncommon</button></div><button data-start>Start</button><button data-queue>Queue</button></div>
</div><script>
window.__commands=[];window.__ui=[];
const find=s=>document.querySelector(s);const routes={pending:null,best:false,rarity:0,amount:0,stopMode:'endless',show(skill){window.__ui.push(['show',skill]);find('.routes').hidden=false;},preselect({jobId}){this.pending={jobId};this.rarity=0;this.best=false;window.__ui.push(['pick',jobId]);}};
window.__routes=routes;
find('[data-open="market"]').onclick=()=>find('[data-market-window]').hidden=false;
find('[data-market-mode="buy"]').onclick=()=>find('[data-market-sheet]').hidden=true;
find('[data-sheet-back]').onclick=()=>find('[data-market-sheet]').hidden=true;
for(const tile of document.querySelectorAll('[data-market-list] button'))tile.onclick=()=>{find('[data-market-sheet]').hidden=false;find('[data-sheet-icon]').dataset.item=tile.dataset.item;};
for(const rarity of document.querySelectorAll('[data-sheet-rarity] button'))rarity.onclick=()=>find('[data-sheet-icon]').dataset.item=String(1+1000*Number(rarity.dataset.rarity));
find('[data-trade-close]').onclick=()=>{find('[data-market-trade]').hidden=true;window.__draftCloses=(window.__draftCloses??0)+1;};
find('[data-list-side="buy"]').onclick=()=>{const draft=find('[data-market-trade]');draft.hidden=false;draft.dataset.item=find('[data-sheet-icon]').dataset.item;draft.dataset.side='buy';};
find('[data-opt-line]').onclick=()=>{const toggle=find('[data-opt-line]'),open=toggle.getAttribute('aria-expanded')!=='true';window.__optionToggles=(window.__optionToggles??0)+1;if(window.__blockOptionOpen)return;toggle.setAttribute('aria-expanded',String(open));find('.route-options').dataset.sheet=open?'open':'shut';find('[data-opt-sheet]').hidden=!open;};
for(const button of document.querySelectorAll('[data-stop-mode]'))button.onclick=()=>{routes.stopMode=button.dataset.stopMode;for(const pane of document.querySelectorAll('[data-stop-pane]'))pane.hidden=pane.dataset.stopPane!==routes.stopMode;};
find('[data-amount-any]').oninput=e=>routes.amount=Math.min(window.__maxAmount??1e9,Number(e.target.value));
for(const rarity of document.querySelectorAll('[data-rarity-choices] button'))rarity.onclick=()=>routes.rarity=Number(rarity.dataset.rarity);
for(const selector of ['[data-start]','[data-queue]','[data-trade-go]'])find(selector).onclick=()=>window.__commands.push(selector);
find('[data-trade-price-in]').addEventListener('focusout',e=>{if(window.__roundPrice)e.target.value=Number(e.target.value)+1;});
window.WebSocket=class extends EventTarget{send(value){window.__commands.push(value);}};
</script></body></html>
